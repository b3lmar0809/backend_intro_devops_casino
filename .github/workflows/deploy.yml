name: CI/CD - casino-backend (build/push -> deploy)

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: casino-eks
  SERVICE_NAME: casino-backend
  IMAGE_VERSION: v1.0.0

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - name: 1. Descargar el codigo del repo
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales de AWS (temporales del lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build y push (3 tags - vX.Y.Z, latest, sha)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$SERVICE_NAME:$IMAGE_VERSION" \
            -t "$REGISTRY/$SERVICE_NAME:latest" \
            -t "$REGISTRY/$SERVICE_NAME:${{ github.sha }}" \
            .
          docker push "$REGISTRY/$SERVICE_NAME:$IMAGE_VERSION"
          docker push "$REGISTRY/$SERVICE_NAME:latest"
          docker push "$REGISTRY/$SERVICE_NAME:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: 1. Descargar el codigo del repo
        uses: actions/checkout@v4

      - name: 2. Configurar credenciales de AWS (temporales del lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 3. Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: 4. Conectar kubectl al cluster EKS
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: 5. Desplegar en EKS
        env:
          REGISTRY: ${{ needs.build-push.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          sed -i "s|<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com|$REGISTRY|g; s|:latest|:$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: 6. Verificar el rollout
        run: |
          kubectl rollout status deployment/$SERVICE_NAME --timeout=180s
          kubectl get pods -l app=$SERVICE_NAME -o wide
